name: Build Sovereign Lightning Dude APK (GGUF + Native ARM64 Engine)

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-android-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout Repository with Git LFS
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Pull GGUF Model, Cross-Compile ARM64 llama-cli & Prepare Assets
        run: |
          git lfs install
          git lfs pull
          
          echo "=== Verifying 500M GGUF Model ==="
          ls -lh main.py service.py buildozer.spec
          ls -lh models/gguf/LightningDude-Sovereign-500M.gguf

          fsize=$(stat -c%s "models/gguf/LightningDude-Sovereign-500M.gguf")
          if [ "$fsize" -lt 100000000 ]; then
            echo "ERROR: GGUF file is too small ($fsize bytes). LFS pull failed!"
            exit 1
          fi

          mkdir -p assets
          cp models/gguf/LightningDude-Sovereign-500M.gguf assets/LightningDude-Sovereign-500M.gguf

          # Cross-compile static ARM64 llama-cli using Android NDK so GGUF runs natively on phone
          echo "=== Cross-Compiling Native ARM64 llama-cli for Android ==="
          NDK_PATH="$ANDROID_NDK_HOME"
          if [ ! -d "$NDK_PATH" ]; then
            NDK_PATH=$(find /usr/local/lib/android/sdk/ndk -maxdepth 1 -mindepth 1 -type d | sort -V | tail -n 1)
          fi
          echo "Using Android NDK: $NDK_PATH"

          git clone --depth 1 --branch b3600 https://github.com/ggerganov/llama.cpp.git /tmp/llama_android || git clone --depth 1 https://github.com/ggerganov/llama.cpp.git /tmp/llama_android
          cmake -B /tmp/llama_android/build_arm64 -S /tmp/llama_android \
            -DCMAKE_TOOLCHAIN_FILE="$NDK_PATH/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DBUILD_SHARED_LIBS=OFF \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=ON \
            -DLLAMA_NATIVE=OFF \
            -DCMAKE_EXE_LINKER_FLAGS="-static-openmp"
          cmake --build /tmp/llama_android/build_arm64 --config Release -j4 --target llama-cli || cmake --build /tmp/llama_android/build_arm64 --config Release -j4 --target main

          if [ -f "/tmp/llama_android/build_arm64/bin/llama-cli" ]; then
            cp /tmp/llama_android/build_arm64/bin/llama-cli assets/llama-cli
          elif [ -f "/tmp/llama_android/build_arm64/bin/main" ]; then
            cp /tmp/llama_android/build_arm64/bin/main assets/llama-cli
          else
            touch assets/llama-cli
          fi
          chmod +x assets/llama-cli
          ls -lh assets/

          # Create p4a_hook.py to keep .gguf & llama-cli uncompressed & set 6GB Gradle Heap
          cat << 'EOF' > p4a_hook.py
          from pathlib import Path

          def after_apk_build(toolchain):
              pass

          def before_apk_build(toolchain):
              dist_dir = Path(toolchain.ctx.dist_dir) / toolchain.args.dist_name
              gradle_file = dist_dir / "build.gradle"
              if gradle_file.exists():
                  content = gradle_file.read_text(encoding="utf-8")
                  if "noCompress" not in content:
                      patch = "\nandroid {\n    aaptOptions {\n        noCompress 'gguf', 'llama-cli'\n    }\n}\n"
                      gradle_file.write_text(content + patch, encoding="utf-8")
                      print("[⚡] Patched build.gradle with noCompress 'gguf', 'llama-cli'!")

              gradle_props = dist_dir / "gradle.properties"
              props_text = gradle_props.read_text(encoding="utf-8") if gradle_props.exists() else ""
              if "org.gradle.jvmargs" in props_text:
                  lines = [l for l in props_text.splitlines() if not l.startswith("org.gradle.jvmargs")]
                  props_text = "\n".join(lines) + "\n"
              props_text += "\norg.gradle.jvmargs=-Xmx6144m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8\n"
              gradle_props.write_text(props_text, encoding="utf-8")
              print("[⚡] Patched gradle.properties with 6GB Heap Memory!")
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install System Dependencies for Buildozer
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip python3-pip autoconf libtool \
            pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo5 cmake libffi-dev libssl-dev automake ccache \
            libltdl-dev patch

      - name: Set up Python 3.11 & Buildozer
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Buildozer & Cython
        run: |
          pip install --upgrade pip "setuptools<70.0.0" wheel
          pip install buildozer==1.5.0 cython==0.29.36 virtualenv

      - name: Cache Buildozer Android SDK/NDK
        uses: actions/cache@v4
        with:
          path: |
            .buildozer
            ~/.buildozer
          key: buildozer-sdk-ndk-py311-${{ runner.os }}-v4

      - name: Compile Sovereign APK
        env:
          CFLAGS: "-Wno-error -Wno-deprecated-declarations -Wno-incompatible-function-pointer-types"
          JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}
          GRADLE_OPTS: "-Dorg.gradle.jvmargs='-Xmx6144m -XX:MaxMetaspaceSize=1024m' -Dorg.gradle.workers.max=2"
          _JAVA_OPTIONS: "-Xmx6144m"
        run: |
          export PATH="$JAVA_HOME/bin:$PATH"
          java -version
          yes | buildozer android debug
          ls -lh bin/

      - name: Upload Compiled Sovereign APK
        uses: actions/upload-artifact@v4
        with:
          name: LightningDude-JARVAIS-Sovereign-APK
          path: bin/*.apk
