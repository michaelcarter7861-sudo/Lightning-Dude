name: Build Sovereign Lightning Dude APK (GGUF Integrated)

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-android-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout Repository with Git LFS
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Pull GGUF Model via Git LFS & Prepare Assets
        run: |
          git lfs install
          git lfs pull
          
          echo "=== Checking GGUF Model & Core Files ==="
          ls -lh main.py service.py buildozer.spec
          ls -lh models/gguf/LightningDude-Sovereign-500M.gguf

          fsize=$(stat -c%s "models/gguf/LightningDude-Sovereign-500M.gguf")
          if [ "$fsize" -lt 100000000 ]; then
            echo "ERROR: GGUF file is too small ($fsize bytes). LFS pull failed!"
            exit 1
          fi
          echo "[⚡] Verified 500M GGUF Model Size: $fsize bytes"

          # Copy GGUF into assets folder for clean Buildozer packaging
          mkdir -p assets
          cp models/gguf/LightningDude-Sovereign-500M.gguf assets/
          ls -lh assets/

      - name: Set up JDK 17 (Required by Android Gradle Plugin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install System Dependencies for Buildozer
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip python3-pip autoconf libtool \
            pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo5 cmake libffi-dev libssl-dev automake ccache \
            libltdl-dev patch

      - name: Set up Python 3.11 & Buildozer
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Buildozer & Cython
        run: |
          pip install --upgrade pip "setuptools<70.0.0" wheel
          pip install buildozer==1.5.0 cython==0.29.36 virtualenv

      - name: Cache Buildozer Android SDK/NDK
        uses: actions/cache@v4
        with:
          path: |
            .buildozer
            ~/.buildozer
          key: buildozer-sdk-ndk-py311-${{ runner.os }}-v4

      - name: Compile Sovereign APK with GGUF Asset
        env:
          CFLAGS: "-Wno-error -Wno-deprecated-declarations -Wno-incompatible-function-pointer-types"
          JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}
        run: |
          export PATH="$JAVA_HOME/bin:$PATH"
          java -version
          yes | buildozer android debug
          ls -lh bin/

      - name: Upload Compiled Sovereign APK
        uses: actions/upload-artifact@v4
        with:
          name: LightningDude-JARVAIS-Sovereign-APK
          path: bin/*.apk
