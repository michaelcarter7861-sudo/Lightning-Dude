name: Forge Lightning Dude Sovereign Model

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  train-sovereign-model:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Lightning-Dude Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies & OpenCode CLI
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          npm install -g opencode-ai || true

      - name: Inject Multi-Provider LLM Config from Secrets
        env:
          LLM_CONFIG_SECRET: ${{ secrets.LLM_CONFIG_JSON }}
        run: |
          if [ -n "$LLM_CONFIG_SECRET" ]; then
            echo "$LLM_CONFIG_SECRET" > llm_config.json
            echo "[⚡] llm_config.json injected successfully from repository secrets."
          else
            echo "[WARNING] LLM_CONFIG_JSON secret not found, using fallback configuration."
          fi

      - name: Run Advanced OpenCode Multi-Provider Training Distillation
        run: |
          python scripts/generate_opencode_training_data.py

      - name: Run 15-Gate Master Validation Suite
        run: |
          python scripts/validate_lightning_iq.py

      - name: Package Sovereign Lightning Dude Model Bundle
        run: |
          mkdir -p dist/LightningDudeSovereign
          cp -r core agents scripts datasets skills_vault knowledge_vault canary_traps omni_vault system_dna.json lightning_cli.py .opencode.json llm_config.json requirements.txt dist/LightningDudeSovereign/
          tar -czvf dist/LightningDude-SovereignModel-v6.tar.gz -C dist LightningDudeSovereign

      - name: Upload Sovereign Model Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LightningDude-SovereignModel-v6
          path: dist/LightningDude-SovereignModel-v6.tar.gz
