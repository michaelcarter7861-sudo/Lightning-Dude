name: Forge Lightning Dude AI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  train-validate-and-package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Lightning-Dude Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Core Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run 7-Agent Trainer Council & Pre-Build IQ Validation Gate
        run: |
          python scripts/validate_lightning_iq.py

      - name: Package Lightning-Dude Portable Bundle
        run: |
          mkdir -p dist/LightningDude
          cp -r core agents scripts datasets system_dna.json requirements.txt dist/LightningDude/
          tar -czvf dist/LightningDude-Portable-v1.tar.gz -C dist LightningDude

      - name: Upload Lightning-Dude Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LightningDude-Portable-Brain-Bundle
          path: dist/LightningDude-Portable-v1.tar.gz
