name: Forge Lightning Dude Sovereign Model

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      distillation_rounds:
        description: "Multi-Provider Bilingual API Synthesis Rounds (e.g. 3 to 20)"
        required: false
        default: "2"
      sovereign_epochs:
        description: "Qwen2.5-0.5B Uncensored Overwrite Epochs (e.g. 2 to 15)"
        required: false
        default: "2"

permissions:
  contents: write

jobs:
  train-sovereign-model:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout Lightning-Dude Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install PyTorch, Transformers, PEFT (LoRA) & SafeTensors
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install transformers peft accelerate safetensors sentencepiece
          pip install -r requirements.txt

      - name: Inject & Auto-Repair Multi-Provider LLM Config from Secrets
        env:
          LLM_CONFIG_SECRET: ${{ secrets.LLM_CONFIG_JSON }}
        run: |
          if [ -n "$LLM_CONFIG_SECRET" ]; then
            printf "%s\n" "$LLM_CONFIG_SECRET" > llm_config.json
            echo "[⚡] llm_config.json injected successfully from repository secrets."
          else
            echo "[WARNING] LLM_CONFIG_JSON secret not found in repo settings."
          fi

      - name: Stage 1 - Multi-Provider Bilingual (Urdu + English) Distillation
        env:
          DISTILLATION_ROUNDS: ${{ github.event.inputs.distillation_rounds || '2' }}
        run: |
          python scripts/generate_opencode_training_data.py

      - name: Stage 2 - Overwrite & Fine-Tune Qwen2.5-0.5B into Uncensored Sovereign Model
        env:
          SOVEREIGN_EPOCHS: ${{ github.event.inputs.sovereign_epochs || '2' }}
        run: |
          python scripts/train_sovereign_weights.py

      - name: Stage 3 - Run 15-Gate Master Validation Suite
        run: |
          python scripts/validate_lightning_iq.py

      - name: Stage 4 - Commit & Push Forged Model Directly Into Repository Folder (Chunked Push)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -f llm_config.json
          rm -rf dist/ models/lightning_sovereign_custom_580mb.pt
          find . -type d -name "__pycache__" -exec rm -rf {} + || true

          git config --global user.name "Lightning Dude Autonomous Forger"
          git config --global user.email "forger@lightning.dude"
          git config --global http.postBuffer 524288000
          git config --global http.maxRequestBuffer 524288000

          # Pull latest changes first to prevent non-fast-forward conflicts
          git pull origin main --no-rebase || true

          # Step A: Commit & push dataset, brain, and tokenizer/config files first
          git add datasets/ core/lightning_dude.ldbrain
          git add models/LightningDude-Sovereign-500M/*.json models/LightningDude-Sovereign-500M/*.txt models/LightningDude-Sovereign-500M/*.model || true
          git diff --staged --quiet || (git commit -m "feat(model): add sovereign tokenizer, config and distilled datasets [skip ci]" && git push origin main)

          # Step B: Commit & push each ~45MB model shard one by one so HTTP 408 never happens!
          for shard in models/LightningDude-Sovereign-500M/*.safetensors; do
            if [ -f "$shard" ]; then
              echo "[⚡] Pushing model weight shard: $shard ..."
              git add "$shard"
              git diff --staged --quiet || (git commit -m "feat(weights): add forged sovereign neural shard $(basename $shard) [skip ci]" && git push origin main)
            fi
          done
          echo "[✅] Entire 500M Sovereign Model successfully committed into repository folder models/LightningDude-Sovereign-500M/!"

      - name: Stage 5 - Upload Complete Sovereign Model Artifact Backup
        uses: actions/upload-artifact@v4
        with:
          name: LightningDude-QwenSovereign-500M
          path: models/LightningDude-Sovereign-500M/
          compression-level: 0
