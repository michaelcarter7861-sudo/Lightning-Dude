name: JARVAIS Autonomous Marathon Training

on:
  push:
    branches: [ "main", "master" ]
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
    inputs:
      distillation_rounds:
        description: "Marathon API Synthesis Rounds"
        required: false
        default: "5"
      sovereign_epochs:
        description: "Continuous Training Epochs"
        required: false
        default: "4"

permissions:
  contents: write

jobs:
  marathon-train:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout JARVAIS Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Training Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install transformers peft accelerate safetensors sentencepiece requests psutil
          pip install -r requirements.txt || true

      - name: Inject Multi-Provider LLM Config from Secrets
        env:
          LLM_CONFIG_SECRET: ${{ secrets.LLM_CONFIG_JSON }}
        run: |
          if [ -n "$LLM_CONFIG_SECRET" ]; then
            printf "%s\n" "$LLM_CONFIG_SECRET" > llm_config.json
            echo "[⚡] llm_config.json injected successfully."
          else
            echo "[WARNING] LLM_CONFIG_JSON secret missing."
          fi

      - name: Stage 1 - Marathon Multi-Provider Dataset Synthesis
        env:
          DISTILLATION_ROUNDS: ${{ github.event.inputs.distillation_rounds || '5' }}
        run: |
          python scripts/generate_opencode_training_data.py

      - name: Stage 2 - Continual Abliterated Training from Repo Shards
        env:
          SOVEREIGN_EPOCHS: ${{ github.event.inputs.sovereign_epochs || '4' }}
        run: |
          python scripts/train_sovereign_weights.py

      - name: Stage 3 - Run Validation Gates
        run: |
          python scripts/validate_lightning_iq.py || true

      - name: Stage 4 - Auto-Commit & Push Updated JARVAIS Shards to Repository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -f llm_config.json
          find . -type d -name "__pycache__" -exec rm -rf {} + || true

          git config --global user.name "JARVAIS Autonomous Forger"
          git config --global user.email "forger@jarvais.ai"
          git config --global http.postBuffer 524288000

          git pull origin main --no-rebase || true

          git add datasets/ core/lightning_dude.ldbrain system_dna.json
          find models/LightningDude-Sovereign-500M/ -maxdepth 1 -type f ! -name "*.safetensors*" -exec git add {} +
          git diff --staged --quiet || (git commit -m "feat(jarvais): autonomous marathon distillation and config update [skip ci]" && git push origin main)

          for wfile in models/LightningDude-Sovereign-500M/*.safetensors*; do
            if [ -f "$wfile" ]; then
              echo "[⚡] Pushing marathon weight chunk: $wfile ..."
              git add "$wfile"
              git diff --staged --quiet || (git commit -m "feat(weights): marathon training weight update $(basename $wfile) [skip ci]" && git push origin main)
            fi
          done
          echo "[✅] JARVAIS Marathon Training Cycle Completed & Synced to Repository!"
