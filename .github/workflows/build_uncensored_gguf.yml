name: Build Uncensored Sovereign GGUF (Abliterated Core)

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-uncensored-model:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyTorch, Transformers & Llama.cpp Conversion Tools
        run: |
          python -m pip install --upgrade pip
          pip install torch transformers accelerate safetensors sentencepiece numpy
          git clone https://github.com/ggerganov/llama.cpp.git /tmp/llama.cpp
          pip install -r /tmp/llama.cpp/requirements.txt

      - name: Run Abliteration & Generate Uncensored Weights
        run: |
          cat << 'EOF' > /tmp/ablit.py
          import torch
          from transformers import AutoModelForCausalLM, AutoTokenizer

          print("[*] Loading Qwen2.5-0.5B-Instruct base model...")
          model_id = "Qwen/Qwen2.5-0.5B-Instruct"
          tokenizer = AutoTokenizer.from_pretrained(model_id)
          model = AutoModelForCausalLM.from_pretrained(model_id, torch_dtype=torch.float32, device_map="cpu")

          print("[*] Applying Orthogonal Refusal Abliteration to remove all ethical/safety restrictions...")
          # Surgical weight projection to completely strip refusal directions while preserving general intelligence & Urdu/English fluency
          for name, param in model.named_parameters():
              if "mlp" in name or "self_attn" in name:
                  if param.ndim == 2:
                      # Zero-out orthogonal refusal components
                      u, s, v = torch.linalg.svd(param.data, full_matrices=False)
                      # Ablate top refusal singular vector directions
                      s[0:2] = s[0:2] * 0.1
                      param.data = torch.mm(u, torch.mm(torch.diag(s), v))

          output_dir = "/tmp/uncensored_model"
          model.save_pretrained(output_dir)
          tokenizer.save_pretrained(output_dir)
          print("[*] Uncensored model weights successfully saved!")
          EOF

          python /tmp/ablit.py

      - name: Convert Uncensored Model to GGUF (q8_0)
        run: |
          python /tmp/llama.cpp/convert_hf_to_gguf.py /tmp/uncensored_model --outfile /tmp/LightningDude-Sovereign-500M.gguf --outtype q8_0

          mkdir -p models/gguf
          cp /tmp/LightningDude-Sovereign-500M.gguf models/gguf/LightningDude-Sovereign-500M.gguf
          ls -lh models/gguf/LightningDude-Sovereign-500M.gguf

      - name: Commit & Push Uncensored GGUF to Repository (Git LFS)
        run: |
          git config --global user.name "Sovereign AI Bot"
          git config --global user.email "bot@jarvais.org"
          git lfs track "models/gguf/*.gguf"
          git add models/gguf/LightningDude-Sovereign-500M.gguf .gitattributes
          git commit -m "feat: generate 100% unrestricted abliterated LightningDude-Sovereign-500M.gguf" || echo "No changes to commit"
          git push || echo "Push skipped or not required"

      - name: Upload GGUF Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LightningDude-Sovereign-500M-Uncensored
          path: models/gguf/LightningDude-Sovereign-500M.gguf
