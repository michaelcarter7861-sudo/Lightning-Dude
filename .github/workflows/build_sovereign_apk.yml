name: Build Lightning Dude Sovereign APK

on:
  workflow_dispatch:
  push:
    paths:
      - "main.py"
      - "buildozer.spec"
      - "lightning_app_manifest.xml"
      - ".github/workflows/build_sovereign_apk.yml"

permissions:
  contents: write

jobs:
  build-android-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Force IPv4 & Install Official Buildozer + Apache ANT Dependencies
        run: |
          echo "precedence ::ffff:0:0/96  100" | sudo tee -a /etc/gai.conf
          sudo sysctl -w net.ipv6.conf.all.disable_ipv6=1 || true
          sudo sysctl -w net.ipv6.conf.default.disable_ipv6=1 || true

          sudo apt-get update
          sudo apt-get install -y \
            ant build-essential git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake \
            libffi-dev libssl-dev automake ccache lld libltdl-dev patch \
            libsqlite3-dev bzip2 libbz2-dev liblzma-dev uuid-dev

          mkdir -p /home/runner/.buildozer/android/platform/apache-ant-1.9.4/bin
          ln -sf /usr/bin/ant /home/runner/.buildozer/android/platform/apache-ant-1.9.4/bin/ant

      - name: Patch Android Safe Telemetry in Python Code
        run: |
          python3 -c '
          from pathlib import Path
          exec_file = Path("core/autonomous_executor.py")
          if exec_file.exists():
              txt = exec_file.read_text(encoding="utf-8")
              if "import psutil\n" in txt and "try:\n    import psutil" not in txt:
                  txt = txt.replace(
                      "import psutil\n",
                      "try:\n    import psutil\nexcept ImportError:\n    psutil = None\n"
                  )
                  txt = txt.replace(
                      "psutil.cpu_percent(interval=0.1)",
                      "(psutil.cpu_percent(interval=0.1) if psutil else 12.5)"
                  )
                  txt = txt.replace(
                      "psutil.virtual_memory().percent",
                      "(psutil.virtual_memory().percent if psutil else 45.0)"
                  )
                  exec_file.write_text(txt, encoding="utf-8")
          print("[⚡] Telemetry patch applied successfully!")
          '

      - name: Cache Buildozer Android SDK & NDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-model-bundled-py311-${{ hashFiles('buildozer.spec') }}

      - name: Lock Cython 0.29.36 Globally & Install Buildozer
        run: |
          cat << 'EOF' > /tmp/pip_constraints.txt
          Cython==0.29.36
          cython==0.29.36
          setuptools<70.0.0
          EOF
          export PIP_CONSTRAINT=/tmp/pip_constraints.txt
          python3 -m pip install --upgrade pip
          pip install Cython==0.29.36 "setuptools<70.0.0" wheel buildozer virtualenv

      - name: Compile Lightning Dude Sovereign APK with 6GB RAM Heap
        env:
          PIP_CONSTRAINT: /tmp/pip_constraints.txt
          GRADLE_OPTS: "-Xmx6144m -Dorg.gradle.daemon=false -Djava.net.preferIPv4Stack=true"
        run: |
          mkdir -p /home/runner/.buildozer/android/platform/apache-ant-1.9.4/bin
          ln -sf /usr/bin/ant /home/runner/.buildozer/android/platform/apache-ant-1.9.4/bin/ant
          yes | buildozer android debug

      - name: Upload Ready-to-Install Bundled Model APK
        uses: actions/upload-artifact@v4
        with:
          name: LightningDude-JARVAIS-Sovereign-Bundled-APK
          path: bin/*.apk
