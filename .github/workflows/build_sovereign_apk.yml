name: Build Lightning Dude Sovereign APK

on:
  workflow_dispatch:
  push:
    paths:
      - "main.py"
      - "buildozer.spec"
      - "lightning_app_manifest.xml"
      - ".github/workflows/build_sovereign_apk.yml"

permissions:
  contents: write

jobs:
  build-android-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout Repository & Trained JARVAIS Model
        uses: actions/checkout@v4

      - name: Set up Python 3.10 for Buildozer
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Java JDK 17 (Required for Android SDK/Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install Official Buildozer Ubuntu Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake \
            libffi-dev libssl-dev automake ccache lld libltdl-dev patch

      - name: Cache Buildozer Android SDK & NDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-android-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-android-

      - name: Prepare Model Shards & Patch Android Safe Telemetry
        run: |
          python3 -c '
          import json
          from pathlib import Path
          
          # 1. Reassemble split model shards
          folder = Path("models/LightningDude-Sovereign-500M")
          manifest = folder / "shard_chunks_manifest.json"
          if manifest.exists():
              data = json.loads(manifest.read_text())
              for orig, parts in data.get("split_files", {}).items():
                  target = folder / orig
                  if not target.exists():
                      with open(target, "wb") as out:
                          for p in parts:
                              p_path = folder / p
                              if p_path.exists():
                                  out.write(p_path.read_bytes())
                                  p_path.unlink()
          
          # 2. Ensure core/autonomous_executor.py uses safe psutil import on Android
          exec_file = Path("core/autonomous_executor.py")
          if exec_file.exists():
              txt = exec_file.read_text(encoding="utf-8")
              if "import psutil\n" in txt and "try:\n    import psutil" not in txt:
                  txt = txt.replace(
                      "import psutil\n",
                      "try:\n    import psutil\nexcept ImportError:\n    psutil = None\n"
                  )
                  txt = txt.replace(
                      "psutil.cpu_percent(interval=0.1)",
                      "(psutil.cpu_percent(interval=0.1) if psutil else 12.5)"
                  )
                  txt = txt.replace(
                      "psutil.virtual_memory().percent",
                      "(psutil.virtual_memory().percent if psutil else 45.0)"
                  )
                  exec_file.write_text(txt, encoding="utf-8")
          print("[⚡] Model shards & Android safety patches ready!")
          '

      - name: Install Buildozer & Cython
        run: |
          python3 -m pip install --upgrade pip
          pip install "cython<3.0.0" buildozer virtualenv

      - name: Compile Lightning Dude Sovereign APK
        run: |
          yes | buildozer android debug

      - name: Upload Ready-to-Install Lightning Dude APK
        uses: actions/upload-artifact@v4
        with:
          name: LightningDude-JARVAIS-Sovereign-APK
          path: bin/*.apk
