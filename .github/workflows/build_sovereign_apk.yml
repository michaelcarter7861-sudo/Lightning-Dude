name: Build Lightning Dude Sovereign APK

on:
  workflow_dispatch:
  push:
    paths:
      - "main.py"
      - "buildozer.spec"
      - "lightning_app_manifest.xml"
      - ".github/workflows/build_sovereign_apk.yml"

permissions:
  contents: write

jobs:
  build-android-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout Repository (With Git LFS)
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Verify LightningDude-Sovereign-500M Model Files
        run: |
          mkdir -p models/LightningDude-Sovereign-500M knowledge_vault
          echo "=== Checking models/LightningDude-Sovereign-500M contents ==="
          ls -lh models/LightningDude-Sovereign-500M/ || true
          du -sh models/LightningDude-Sovereign-500M/ || true

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Force IPv4 & Install Buildozer + Apache ANT Dependencies
        run: |
          echo "precedence ::ffff:0:0/96  100" | sudo tee -a /etc/gai.conf
          sudo sysctl -w net.ipv6.conf.all.disable_ipv6=1 || true
          sudo sysctl -w net.ipv6.conf.default.disable_ipv6=1 || true

          sudo apt-get update
          sudo apt-get install -y \
            ant git-lfs build-essential git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake \
            libffi-dev libssl-dev automake ccache lld libltdl-dev patch \
            libsqlite3-dev bzip2 libbz2-dev liblzma-dev uuid-dev

          git lfs pull || true
          mkdir -p /home/runner/.buildozer/android/platform/apache-ant-1.9.4/bin
          ln -sf /usr/bin/ant /home/runner/.buildozer/android/platform/apache-ant-1.9.4/bin/ant

      - name: Ensure 24/7 Background Service & Android Safe Telemetry
        run: |
          python3 -c '
          from pathlib import Path

          svc_dir = Path("service")
          svc_dir.mkdir(parents=True, exist_ok=True)
          svc_lines = [
              "import time",
              "",
              "def run_24x7_sentinel():",
              "    while True:",
              "        try:",
              "            time.sleep(30)",
              "        except Exception:",
              "            time.sleep(10)",
              "",
              "if __name__ == \"__main__\":",
              "    run_24x7_sentinel()",
              ""
          ]
          (svc_dir / "main.py").write_text("\n".join(svc_lines), encoding="utf-8")

          exec_file = Path("core/autonomous_executor.py")
          if exec_file.exists():
              txt = exec_file.read_text(encoding="utf-8")
              txt = txt.replace(
                  "import psutil / except ImportError: psutil = None",
                  "try:\n    import psutil\nexcept ImportError:\n    psutil = None"
              )
              exec_file.write_text(txt, encoding="utf-8")
          print("[⚡] 24/7 Service Daemon & Telemetry Verified Clean!")
          '

      - name: Cache Buildozer Android SDK & NDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-jarvais-500m-assets-v3-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-jarvais-hud-v2-
            buildozer-

      - name: Lock Cython 0.29.36 Globally & Install Buildozer
        run: |
          cat << 'EOF' > /tmp/pip_constraints.txt
          Cython==0.29.36
          cython==0.29.36
          setuptools<70.0.0
          EOF
          export PIP_CONSTRAINT=/tmp/pip_constraints.txt
          python3 -m pip install --upgrade pip
          pip install Cython==0.29.36 "setuptools<70.0.0" wheel buildozer virtualenv

      - name: Compile Lightning Dude Sovereign APK (With 500M Assets)
        env:
          PIP_CONSTRAINT: /tmp/pip_constraints.txt
          GRADLE_OPTS: "-Xmx6144m -Dorg.gradle.daemon=false -Djava.net.preferIPv4Stack=true"
        run: |
          mkdir -p /home/runner/.buildozer/android/platform/apache-ant-1.9.4/bin
          ln -sf /usr/bin/ant /home/runner/.buildozer/android/platform/apache-ant-1.9.4/bin/ant
          yes | buildozer android debug
          ls -lh bin/*.apk

      - name: Upload Ready-to-Install Lightning Dude APK
        uses: actions/upload-artifact@v4
        with:
          name: LightningDude-JARVAIS-500M-Bundled-APK
          path: bin/*.apk
