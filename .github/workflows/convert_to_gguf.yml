
name: Convert Model to GGUF and Save to Repo

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert-and-push-gguf:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout Repository with LFS
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Force Full Git LFS Pull & Verify Binaries
        run: |
          git lfs install
          git lfs pull
          
          echo "=== Verifying actual file sizes in models directory ==="
          find models/LightningDude-Sovereign-500M -type f -exec ls -lh {} \;

          # Check if files are still LFS pointer text files (< 1MB) instead of real weights
          for f in models/LightningDude-Sovereign-500M/*.safetensors*; do
              if [ -f "$f" ]; then
                  fsize=$(stat -c%s "$f")
                  if [ "$fsize" -lt 1000000 ]; then
                      echo "ERROR: File $f is still a Git LFS pointer ($fsize bytes)!"
                      exit 1
                  fi
              fi
          done

          # Normalize shard filenames if needed
          cd models/LightningDude-Sovereign-500M
          for f in *safetensors*; do
              if [[ "$f" == *.part* ]]; then
                  target=$(echo "$f" | sed 's/\.safetensors\.part.*$/.safetensors/')
                  echo "Copying $f -> $target"
                  cp -f "$f" "$target"
              fi
          done
          cd ../..

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Clone llama.cpp & Install Conversion Dependencies
        run: |
          git clone https://github.com/ggerganov/llama.cpp.git
          cd llama.cpp
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install torch transformers sentencepiece protobuf safetensors

      - name: Convert LightningDude-Sovereign-500M to GGUF
        run: |
          python3 llama.cpp/convert_hf_to_gguf.py models/LightningDude-Sovereign-500M \
            --outfile models/LightningDude-Sovereign-500M.gguf \
            --outtype q8_0

          ls -lh models/

      - name: Commit & Push GGUF Model to Repository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "Lightning Dude Autonomous Builder"
          git config --global user.email "builder@jarvais.internal"
          
          mkdir -p models/gguf
          cp models/LightningDude-Sovereign-500M.gguf models/gguf/
          
          git add models/gguf/LightningDude-Sovereign-500M.gguf
          git commit -m "⚡ Auto-converted GGUF Sovereign Model saved by GitHub Actions" || echo "No changes to commit"
          git push origin main
