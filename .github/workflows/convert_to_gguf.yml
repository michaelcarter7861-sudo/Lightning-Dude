name: Convert Model to GGUF and Save to Repo

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert-and-push-gguf:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout Repository with LFS
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Force Full Git LFS Pull & Merge Sharded Parts
        run: |
          git lfs install
          git lfs pull
          
          echo "=== Verifying model weights in directory ==="
          ls -lh models/LightningDude-Sovereign-500M/ || true

          cd models/LightningDude-Sovereign-500M

          # Merge sharded safetensors parts if present
          if [ -f "model-00001-of-00019.safetensors.part00" ]; then
              echo "Merging model-00001 sharded parts into model-00001-of-00019.safetensors..."
              cat model-00001-of-00019.safetensors.part* > model-00001-of-00019.safetensors
          fi

          # Fix potential list/dict issue in tokenizer_config.json extra_special_tokens if needed
          python3 -c '
          import json
          from pathlib import Path
          cfg_path = Path("tokenizer_config.json")
          if cfg_path.exists():
              try:
                  data = json.loads(cfg_path.read_text(encoding="utf-8"))
                  if "extra_special_tokens" in data and isinstance(data["extra_special_tokens"], list):
                      # Convert list to dict if needed by transformers
                      data["extra_special_tokens"] = {str(item): i for i, item in enumerate(data["extra_special_tokens"])}
                      cfg_path.write_text(json.dumps(data, indent=2), encoding="utf-8")
                      print("[⚡] Fixed tokenizer_config.json extra_special_tokens format!")
              except Exception as e:
                  print(f"Tokenizer config patch warning: {e}")
          '

          ls -lh model-00001-of-00019.safetensors || true
          cd ../..

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Clone llama.cpp & Install Conversion Dependencies
        run: |
          git clone https://github.com/ggerganov/llama.cpp.git
          cd llama.cpp
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install torch transformers sentencepiece protobuf safetensors

      - name: Convert LightningDude-Sovereign-500M to GGUF
        run: |
          python3 llama.cpp/convert_hf_to_gguf.py models/LightningDude-Sovereign-500M \
            --outfile models/LightningDude-Sovereign-500M.gguf \
            --outtype q8_0 \
            --vocab-type hf

          ls -lh models/

      - name: Commit & Push GGUF Model to Repository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "Lightning Dude Autonomous Builder"
          git config --global user.email "builder@jarvais.internal"
          
          mkdir -p models/gguf
          cp models/LightningDude-Sovereign-500M.gguf models/gguf/
          
          git add models/gguf/LightningDude-Sovereign-500M.gguf
          git commit -m "⚡ Auto-converted GGUF Sovereign Model saved by GitHub Actions" || echo "No changes to commit"
          git push origin main
