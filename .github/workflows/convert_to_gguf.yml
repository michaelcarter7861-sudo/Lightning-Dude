name: Convert Model to GGUF and Save to Repo

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert-and-push-gguf:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout Repository with LFS
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Force Full Git LFS Pull & Merge Sharded Parts
        run: |
          git lfs install
          git lfs pull
          
          echo "=== Verifying model weights in directory ==="
          ls -lh models/LightningDude-Sovereign-500M/ || true

          cd models/LightningDude-Sovereign-500M

          # 1. Merge sharded safetensors parts if present
          if [ -f "model-00001-of-00019.safetensors.part00" ]; then
              echo "Merging model-00001 sharded parts into model-00001-of-00019.safetensors..."
              cat model-00001-of-00019.safetensors.part* > model-00001-of-00019.safetensors
          fi

          # 2. Fix invalid integer/list formats in tokenizer_config.json & generation_config.json
          python3 -c '
          import json
          from pathlib import Path

          for fname in ["tokenizer_config.json", "generation_config.json"]:
              fpath = Path(fname)
              if fpath.exists():
                  try:
                      data = json.loads(fpath.read_text(encoding="utf-8"))
                      
                      # Fix extra_special_tokens or chat template tokens if they are ints
                      for key in ["extra_special_tokens", "bos_token", "eos_token", "pad_token", "im_start", "im_end"]:
                          if key in data:
                              val = data[key]
                              if isinstance(val, list):
                                  data[key] = {str(item): i for i, item in enumerate(val)}
                              elif isinstance(val, int):
                                  # If token is stored as ID integer, convert or remove to let tokenizer re-infer
                                  del data[key]
                      
                      # Also check added_tokens_decoder if present
                      if "added_tokens_decoder" in data:
                          for tid, tinfo in list(data["added_tokens_decoder"].items()):
                              if isinstance(tinfo, dict) and "content" in tinfo and isinstance(tinfo["content"], int):
                                  tinfo["content"] = str(tinfo["content"])

                      fpath.write_text(json.dumps(data, indent=2), encoding="utf-8")
                      print(f"[⚡] Successfully sanitized {fname}!")
                  except Exception as e:
                      print(f"Sanitization warning for {fname}: {e}")
          '

          ls -lh model-00001-of-00019.safetensors || true
          cd ../..

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Clone llama.cpp & Install Conversion Dependencies
        run: |
          git clone https://github.com/ggerganov/llama.cpp.git
          cd llama.cpp
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install torch transformers sentencepiece protobuf safetensors

      - name: Convert LightningDude-Sovereign-500M to GGUF
        run: |
          python3 llama.cpp/convert_hf_to_gguf.py models/LightningDude-Sovereign-500M \
            --outfile models/LightningDude-Sovereign-500M.gguf \
            --outtype q8_0

          ls -lh models/

      - name: Commit & Push GGUF Model to Repository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "Lightning Dude Autonomous Builder"
          git config --global user.email "builder@jarvais.internal"
          
          mkdir -p models/gguf
          cp models/LightningDude-Sovereign-500M.gguf models/gguf/
          
          git add models/gguf/LightningDude-Sovereign-500M.gguf
          git commit -m "⚡ Auto-converted GGUF Sovereign Model saved by GitHub Actions" || echo "No changes to commit"
          git push origin main
