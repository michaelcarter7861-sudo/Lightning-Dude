name: Convert Model to GGUF and Save to Repo

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert-and-push-gguf:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout Repository with LFS
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Force Full Git LFS Pull & Fix Configs
        run: |
          git lfs install
          git lfs pull
          
          echo "=== Verifying model weights in directory ==="
          ls -lh models/LightningDude-Sovereign-500M/ || true

          cd models/LightningDude-Sovereign-500M

          # 1. Merge sharded safetensors parts if present
          if [ -f "model-00001-of-00019.safetensors.part00" ]; then
              echo "Merging model-00001 sharded parts into model-00001-of-00019.safetensors..."
              cat model-00001-of-00019.safetensors.part* > model-00001-of-00019.safetensors
          fi

          # 2. Completely sanitize tokenizer_config.json to remove integer-valued special tokens
          python3 -c '
          import json
          from pathlib import Path

          cfg_path = Path("tokenizer_config.json")
          if cfg_path.exists():
              try:
                  data = json.loads(cfg_path.read_text(encoding="utf-8"))
                  
                  if "extra_special_tokens" in data:
                      est = data["extra_special_tokens"]
                      if isinstance(est, dict):
                          new_est = {k: v for k, v in est.items() if not isinstance(v, int)}
                          if new_est:
                              data["extra_special_tokens"] = new_est
                          else:
                              del data["extra_special_tokens"]
                      else:
                          del data["extra_special_tokens"]

                  for key in list(data.keys()):
                      if isinstance(data[key], int) and any(t in key.lower() for t in ["token", "im_start", "im_end"]):
                          del data[key]

                  cfg_path.write_text(json.dumps(data, indent=2), encoding="utf-8")
                  print("[⚡] tokenizer_config.json completely sanitized and fixed!")
              except Exception as e:
                  print(f"Sanitization error: {e}")
          '

          ls -lh model-00001-of-00019.safetensors || true
          cd ../..

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Clone llama.cpp & Install Conversion Dependencies
        run: |
          git clone https://github.com/ggerganov/llama.cpp.git
          cd llama.cpp
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install torch transformers sentencepiece protobuf safetensors

      - name: Convert LightningDude-Sovereign-500M to GGUF
        run: |
          python3 llama.cpp/convert_hf_to_gguf.py models/LightningDude-Sovereign-500M \
            --outfile models/LightningDude-Sovereign-500M.gguf \
            --outtype q8_0

          ls -lh models/

      - name: Commit & Push GGUF Model to Repository via Git LFS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "Lightning Dude Autonomous Builder"
          git config --global user.email "builder@jarvais.internal"
          
          mkdir -p models/gguf
          cp models/LightningDude-Sovereign-500M.gguf models/gguf/

          # Track .gguf files using Git LFS so GitHub accepts files > 100MB
          git lfs track "models/gguf/*.gguf"
          git add .gitattributes
          
          git add models/gguf/LightningDude-Sovereign-500M.gguf
          git commit -m "⚡ Auto-converted GGUF Sovereign Model (LFS) saved by GitHub Actions" || echo "No changes to commit"
          git push origin main
